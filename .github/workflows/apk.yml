name: Gerar APK do motorista
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_SENHA: ${{ secrets.KEYSTORE_SENHA }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fatran.jks"; export KEYSTORE_FILE="$RUNNER_TEMP/fatran.jks"; else echo "::warning::Sem chave fixa: o APK não poderá atualizar por cima do anterior"; fi
          gradle assembleDebug --no-daemon -PvCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: fatran-motorista-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na branch apk
        run: |
          mkdir /tmp/pub && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/pub/fatran-motorista.apk
          cd /tmp/pub && git init -q -b apk && git config user.name actions && git config user.email actions@github.com
          git add . && git commit -q -m "APK $GITHUB_SHA" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - name: Publicar APK no site (atualização automática)
        if: env.KEYSTORE_B64 != ''
        run: |
          git config user.name actions && git config user.email actions@github.com
          mkdir -p web/app
          cp android/app/build/outputs/apk/debug/app-debug.apk web/app/fatran-motorista.apk
          echo '{"code": ${{ github.run_number }}, "apk": "/app/fatran-motorista.apk"}' > web/app/versao.json
          git add web/app && git commit -q -m "APK ${{ github.run_number }} [skip ci]" && git pull -q --rebase origin main && git push -q origin HEAD:main
