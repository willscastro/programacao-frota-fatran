name: Gerar APK do motorista
permissions:
  contents: write
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fatran-motorista-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK na branch apk
        run: |
          mkdir /tmp/pub && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/pub/fatran-motorista.apk
          cd /tmp/pub && git init -q -b apk && git config user.name actions && git config user.email actions@github.com
          git add . && git commit -q -m "APK $GITHUB_SHA" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
